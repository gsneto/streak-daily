name: daily-streak

on:
  schedule:
    - cron: "0 12 * * *"
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-streak
  cancel-in-progress: false

jobs:
  streak:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: daily commit
        run: |
          today=$(date -u +%F)
          if grep -q "$today" streak.log; then
            echo "already logged for $today - nothing to do"
            exit 0
          fi
          date -u +"%Y-%m-%d %H:%M UTC daily streak" >> streak.log
          git config user.name "gsneto"
          git config user.email "gsneto@users.noreply.github.com"
          git add streak.log
          git commit -m "daily streak $today"
          git pull --rebase --autostash origin main
          git push
