name: daily-streak

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  streak:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: daily commit
        run: |
          date -u +"%Y-%m-%d %H:%M UTC daily streak" >> streak.log
          git config user.name "gsneto"
          git config user.email "gsneto@users.noreply.github.com"
          git add streak.log
          git diff --cached --quiet || git commit -m "daily streak $(date -u +%F)"
          git push
